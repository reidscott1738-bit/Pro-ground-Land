<!-- @dsCard group="Components" viewport="700x430" name="Buttons & form fields" subtitle="Primary/secondary/ghost on light + dark; labeled inputs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--pg-bone);padding:22px;font-family:var(--font-body)}
.block{margin-bottom:18px}.dark{background:var(--pg-deep-field);border-radius:4px;padding:18px}
.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pg-slate-500);margin-bottom:10px}
.dark .lab{color:var(--pg-slate-300)}
.rowb{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Input, Select, Textarea, Checkbox } = window.ProGroundDesignSystem_313bb9;
function Demo(){
  return (<div>
    <div className="block"><div className="lab">buttons — on light</div>
      <div className="rowb">
        <Button variant="primary">Request an estimate</Button>
        <Button variant="secondary">Call (225) 324-8252</Button>
        <Button variant="ghost">See the gallery</Button>
        <Button variant="primary" size="sm">Small</Button>
        <Button variant="primary" disabled>Disabled</Button>
      </div>
    </div>
    <div className="block dark"><div className="lab">buttons — on deep field</div>
      <div className="rowb">
        <Button variant="primary" onDark>Request an estimate</Button>
        <Button variant="secondary" onDark>Call now</Button>
        <Button variant="ghost" onDark>Learn more</Button>
      </div>
    </div>
    <div className="block"><div className="lab">form fields</div>
      <div className="grid2">
        <Input label="Name" id="n" required />
        <Input label="Phone" id="p" type="tel" required help="Texting accepted." />
        <Select label="Service needed" id="s" required placeholder="Choose a service" options={['Landscape Renovation','Drainage Solution','Grading & Yard Leveling']} />
        <Input label="Property address" id="a" required error="Enter a service-area address" />
      </div>
      <div style={{marginTop:14}}><Checkbox id="t" label="It's fine to text this number" defaultChecked /></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
