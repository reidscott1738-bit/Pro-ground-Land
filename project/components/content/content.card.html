<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--pg-bone);padding:22px;font-family:var(--font-body)}
.rowb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Eyebrow, Badge, PriceBlock } = window.ProGroundDesignSystem_313bb9;
function Demo(){
  return (<div>
    <Eyebrow>Drainage Solutions</Eyebrow>
    <div className="rowb">
      <Badge tone="neutral">Locally owned</Badge>
      <Badge tone="green">100+ homes served</Badge>
      <Badge tone="water">Water &amp; drainage</Badge>
    </div>
    <div className="grid2">
      <PriceBlock service="Landscape Renovations" price="From $750"
        drivers={['Bed square footage','Plant size at install','Removal volume']} />
      <PriceBlock service="Drainage Solutions" price="From $1,000"
        drivers={['Linear feet of pipe','Number of catch basins','Access for equipment']} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
