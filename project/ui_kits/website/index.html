  html,body{margin:0;height:100%}

    .pg-hero-grid{grid-template-columns:1fr !important}

    .pg-desktop-nav{display:none !important}
    .pg-mobile-bar{display:grid !important}

    .pg-gallery{grid-template-columns:1fr 1fr !important;grid-auto-rows:170px !important}
    .pg-collage{min-height:400px !important}
    .pg-hero-loc{display:none !important}
  }
  @media (max-width: 560px){
    .pg-footer-grid{grid-template-columns:1fr !important}
    .pg-checks{grid-template-columns:1fr !important}
    .pg-gallery{grid-template-columns:1fr !important}
    .pg-herotrust{grid-template-columns:repeat(2, max-content) !important;row-gap:26px !important}
