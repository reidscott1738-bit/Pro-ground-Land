<!-- @dsCard group="Brand" viewport="700x220" name="Contour motif" subtitle="The signature device — survey/grading line work. Decorative, aria-hidden." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--pg-bone);padding:0}
.light{padding:26px 24px 20px}
.dark{background:var(--pg-deep-field);padding:22px 24px}
.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pg-slate-500);margin-bottom:12px}
.dark .lab{color:var(--pg-slate-300)}
.c{height:40px;background-repeat:repeat-x;background-position:center}
.c1{background-image:repeating-radial-gradient(circle at 50% 140%, transparent 0 14px, var(--pg-slate-400) 14px 15px)}
.c2{background-image:repeating-linear-gradient(90deg,transparent 0 8px,color-mix(in srgb,var(--pg-slate-500) 55%,transparent) 8px 9px)}
.dark .c1{background-image:repeating-radial-gradient(circle at 50% 140%, transparent 0 14px, rgba(255,255,255,.16) 14px 15px)}
.accent{height:2px;background:var(--pg-growth);width:60px;margin-top:8px}</style>
</head><body>
<div class="light"><div class="lab">contour intervals — on bone</div><div class="c c1"></div><div class="c c2" style="margin-top:8px"></div></div>
<div class="dark"><div class="lab">on deep field — with green accent line</div><div class="c c1"></div><div class="accent"></div></div>
</body></html>
