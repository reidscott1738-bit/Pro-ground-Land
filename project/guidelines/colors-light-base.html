<!-- @dsCard group="Colors" viewport="700x180" name="Light base" subtitle="Bone page background + white cards. Never pure white at scale." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--pg-bone);padding:20px}.row{display:flex;gap:14px}.sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--pg-line)}.chip{height:78px}.meta{padding:8px 10px;background:#fff}.n{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pg-ink)}.h{font-family:var(--font-mono);font-size:12px;color:var(--pg-slate-500);margin-top:2px}.u{font-family:var(--font-mono);font-size:10px;color:var(--pg-slate-400);margin-top:4px}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:#F4F1E9"></div><div class="meta"><div class="n">Bone</div><div class="h">#F4F1E9</div><div class="u">page background</div></div></div>
<div class="sw"><div class="chip" style="background:#ECE7DC"></div><div class="meta"><div class="n">Bone Deep</div><div class="h">#ECE7DC</div><div class="u">alternating sections</div></div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="n">White</div><div class="h">#FFFFFF</div><div class="u">cards lift off bone</div></div></div>
</div></body></html>
