<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--pg-bone);padding:20px;display:flex;gap:16px}.dark{flex:1;background:var(--pg-deep-field);border-radius:var(--radius-sm);padding:16px;color:#fff}.light{flex:1;background:#fff;border:1px solid var(--pg-line);border-radius:var(--radius-sm);padding:16px}.lab{font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--pg-slate-400);margin-bottom:10px}.on-dark .lab{color:var(--pg-slate-300)}.blue{font-family:var(--font-mono);font-weight:600;font-size:15px}.desc{font-family:var(--font-body);font-size:13px;margin-top:8px;line-height:1.5}</style>
</head><body>
<div class="dark on-dark"><div class="lab">on dark</div><div class="blue" style="color:#1863B8">■ #1863B8 Survey Blue</div><div class="desc" style="color:#A9AEB4">Water-flow diagrams, drainage diagnostic, catch-basin callouts.</div></div>
<div class="light"><div class="lab">on light</div><div class="blue" style="color:#14538F">■ #14538F Survey Ink</div><div class="desc" style="color:var(--pg-slate-600)">Darker blue that passes contrast for drainage copy on bone/white.</div></div>
</body></html>
