<!-- @dsCard group="Colors" viewport="700x210" name="Warm neutral ramp" subtitle="Text + borders bridging Bone to Deep Field" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--pg-bone);padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sw{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--pg-line)}.chip{height:46px}.meta{padding:6px 8px;background:#fff}.n{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--pg-ink)}.h{font-family:var(--font-mono);font-size:10px;color:var(--pg-slate-500)}</style>
</head><body><div class="grid">
<div class="sw"><div class="chip" style="background:#12151C"></div><div class="meta"><div class="n">Ink</div><div class="h">#12151C</div></div></div>
<div class="sw"><div class="chip" style="background:#333941"></div><div class="meta"><div class="n">Slate 700</div><div class="h">#333941</div></div></div>
<div class="sw"><div class="chip" style="background:#6A7178"></div><div class="meta"><div class="n">Slate 500</div><div class="h">#6A7178</div></div></div>
<div class="sw"><div class="chip" style="background:#949AA0"></div><div class="meta"><div class="n">Slate 400</div><div class="h">#949AA0</div></div></div>
<div class="sw"><div class="chip" style="background:#C1BEB4"></div><div class="meta"><div class="n">Slate 300</div><div class="h">#C1BEB4</div></div></div>
<div class="sw"><div class="chip" style="background:#DBD7CC"></div><div class="meta"><div class="n">Line</div><div class="h">#DBD7CC</div></div></div>
<div class="sw"><div class="chip" style="background:#C6C2B6"></div><div class="meta"><div class="n">Border card</div><div class="h">#C6C2B6</div></div></div>
<div class="sw"><div class="chip" style="background:#2A313B"></div><div class="meta"><div class="n">Line dark</div><div class="h">#2A313B</div></div></div>
</div></body></html>
