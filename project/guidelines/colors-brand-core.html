<!-- @dsCard group="Colors" viewport="700x180" name="Brand core" subtitle="Growth Green, Survey Blue, Deep Field — sampled from the logo" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--pg-bone);padding:20px}.row{display:flex;gap:14px}.sw{flex:1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--pg-line)}.chip{height:78px}.meta{padding:8px 10px;background:#fff}.n{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--pg-ink)}.h{font-family:var(--font-mono);font-size:12px;color:var(--pg-slate-500);margin-top:2px}.u{font-family:var(--font-mono);font-size:10px;color:var(--pg-slate-400);margin-top:4px}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:#10E016"></div><div class="meta"><div class="n">Growth Green</div><div class="h">#10E016</div><div class="u">dark surfaces · small accents only</div></div></div>
<div class="sw"><div class="chip" style="background:#1863B8"></div><div class="meta"><div class="n">Survey Blue</div><div class="h">#1863B8</div><div class="u">water / drainage content only</div></div></div>
<div class="sw"><div class="chip" style="background:#0B0E15"></div><div class="meta"><div class="n">Deep Field</div><div class="h">#0B0E15</div><div class="u">dark bands — punctuation</div></div></div>
</div></body></html>
